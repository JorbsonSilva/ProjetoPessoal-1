<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Trade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Meu Diário de Trade</h1>
        <div class="banca-resumo">
            <p>Banca Atual: <strong id="valor-banca">R$ 0,00</strong></p>
        </div>
    </header>

    <main>
        <!-- Painel de Registro de Nova Operação -->
        <section class="registro-form">
            <h2>Registrar Nova Entrada</h2>
            
            <form id="form-trade">
                <label for="ativo">Ativo (Par de Moedas):</label>
                <input type="text" id="ativo" placeholder="Ex: EUR/USD" required>

                <label for="direcao">Direção:</label>
                <select id="direcao" required>
                    <option value="call">Call (Acima)</option>
                    <option value="put">Put (Abaixo)</option>
                </select>

                <label for="valor">Valor da Entrada (R$):</label>
                <input type="number" id="valor" step="0.01" placeholder="Ex: 50.00" required>

                <label for="resultado">Resultado:</label>
                <select id="resultado" required>
                    <option value="win">Win (Vitória)</option>
                    <option value="loss">Loss (Derrota)</option>
                    <option value="empate">Empate</option>
                </select>

                <label for="imagem">Print da Operação:</label>
                <input type="file" id="imagem" accept="image/*">

                <button type="submit">Salvar Operação</button>
            </form>
        </section>

        <!-- Aqui entrarão os gráficos no futuro -->
        <section class="dashboard">
            <h2>Evolução do Capital</h2>
            <div id="grafico-container">
                <p>O gráfico aparecerá aqui...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
